[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-inspired-cancer-drug-combinations"
version = "1.0.0"
description = "Label-free QUBO prioritization of cancer-specific drug combinations"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.4",
  "pandas>=2.2,<3",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
sqa = ["openjij==0.12.2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
